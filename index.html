<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatanku</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; margin-top: 0; }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #007bff; }
        button { background: #007bff; color: white; border: none; padding: 12px 18px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #007bff; font-size: 16px; }
        .delete-btn { background: #dc3545; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📝 Catatan Harianku</h2>
    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Tulis catatan baru...">
        <button onclick="tambahCatatan()">Tambah</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    function tambahCatatan() {
        let input = document.getElementById("taskInput");
        let teks = input.value.trim();
        if (teks === "") return alert("Catatan tidak boleh kosong!");

        let ul = document.getElementById("taskList");
        let li = document.createElement("li");
        
        li.innerHTML = `<span>${teks}</span> <button class="delete-btn" onclick="hapusCatatan(this)">Hapus</button>`;
        ul.appendChild(li);
        
        input.value = ""; // Kosongkan input setelah ditambah
    }

    function hapusCatatan(tombol) {
        tombol.parentElement.remove();
    }
</script>

</body>
</html>
